<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 2500px;
  height: 843px;
  overflow: hidden;
}

body {
  background: linear-gradient(160deg, #1c0f09 0%, #120c06 100%);
  font-family: 'Noto Sans Thai', 'Thonburi', 'Arial Unicode MS', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Shimmer line at top */
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  z-index: 10;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(160, 80, 55, .25) 8%,
    rgba(212, 140, 100, .7) 28%,
    rgba(238, 192, 155, .96) 50%,
    rgba(212, 140, 100, .7) 72%,
    rgba(160, 80, 55, .25) 92%,
    transparent 100%
  );
}

/* Ambient top glow */
.ambient {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(
    ellipse 1800px 500px at 50% -120px,
    rgba(212, 144, 106, .11) 0%,
    transparent 70%
  );
}

/* Brand strip */
.brand {
  position: relative;
  z-index: 2;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 52px 90px 0;
}

.wordmark {
  display: flex;
  align-items: center;
  gap: 30px;
}

.wm-icon {
  width: 80px;
  height: 80px;
  border-radius: 22px;
  background: linear-gradient(135deg, #c97850, #6a2a0a);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 28px rgba(0, 0, 0, .4);
  flex-shrink: 0;
}

.wm-name {
  font-size: 58px;
  font-weight: 800;
  letter-spacing: 12px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, .62);
}

.wm-dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #d4906a;
  box-shadow: 0 0 28px rgba(212, 144, 106, .65);
  flex-shrink: 0;
}

.hint {
  font-size: 42px;
  color: rgba(255, 255, 255, .2);
  letter-spacing: 2px;
}

/* Button grid */
.grid {
  position: relative;
  z-index: 2;
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  padding: 44px 60px 56px;
  gap: 28px;
}

.btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 30px;
  border-radius: 56px;
  padding: 50px 20px;
  position: relative;
  overflow: hidden;
  background: rgba(212, 144, 106, .04);
  border: 3px solid rgba(212, 144, 106, .1);
}

/* Inner sheen */
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 56px;
  background: linear-gradient(160deg, rgba(255,255,255,.04) 0%, transparent 50%);
  pointer-events: none;
}

.btn.special {
  background: rgba(238, 192, 155, .04);
  border-color: rgba(238, 192, 155, .13);
}

/* Icon ring */
.icon-ring {
  width: 228px;
  height: 228px;
  border-radius: 68px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: linear-gradient(145deg, rgba(212,144,106,.18) 0%, rgba(80,30,12,.55) 100%);
  border: 4px solid rgba(212, 144, 106, .2);
  box-shadow:
    0 12px 40px rgba(0, 0, 0, .32),
    inset 0 2px 0 rgba(255, 255, 255, .06);
}

.btn.special .icon-ring {
  background: linear-gradient(145deg, rgba(238,192,155,.2) 0%, rgba(105,52,12,.55) 100%);
  border-color: rgba(238, 192, 155, .26);
}

.label {
  font-size: 70px;
  font-weight: 700;
  color: rgba(255, 255, 255, .88);
  text-align: center;
  line-height: 1.15;
  letter-spacing: -1px;
}

.sub {
  font-size: 46px;
  color: rgba(255, 255, 255, .3);
  text-align: center;
  letter-spacing: 1px;
  margin-top: -16px;
}
</style>
</head>
<body>

<div class="ambient"></div>

<!-- Wordmark row -->
<div class="brand">
  <div class="wordmark">
    <div class="wm-icon">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none"
        stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2.5"/>
        <line x1="2" y1="10" x2="22" y2="10"/>
        <line x1="6" y1="14.5" x2="9.5" y2="14.5"/>
      </svg>
    </div>
    <span class="wm-name">Cardly</span>
    <div class="wm-dot"></div>
  </div>
  <span class="hint">เลือกสิ่งที่ต้องการ</span>
</div>

<!-- 3 buttons -->
<div class="grid">

  <!-- เปิด Cardly -->
  <div class="btn">
    <div class="icon-ring">
      <svg width="104" height="104" viewBox="0 0 24 24" fill="none"
        stroke="#d4906a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2.5"/>
        <line x1="2" y1="10" x2="22" y2="10"/>
        <line x1="6" y1="15" x2="9" y2="15"/>
        <line x1="11" y1="15" x2="13" y2="15"/>
      </svg>
    </div>
    <span class="label">เปิด Cardly</span>
    <span class="sub">บัตร · ยอดใช้จ่าย</span>
  </div>

  <!-- โปรโมชัน (champagne) -->
  <div class="btn special">
    <div class="icon-ring">
      <svg width="104" height="104" viewBox="0 0 24 24" fill="none"
        stroke="#ebc8a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
        <circle cx="7" cy="7" r="1.5" fill="#ebc8a8" stroke="none"/>
      </svg>
    </div>
    <span class="label">โปรโมชัน</span>
    <span class="sub">ดีลบัตรวันนี้</span>
  </div>

  <!-- จดรายจ่าย -->
  <div class="btn">
    <div class="icon-ring">
      <svg width="104" height="104" viewBox="0 0 24 24" fill="none"
        stroke="#d4906a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5"/>
        <path d="M15.5 2.5a2.121 2.121 0 0 1 3 3L12 12l-4 1 1-4 6.5-6.5z"/>
      </svg>
    </div>
    <span class="label">จดรายจ่าย</span>
    <span class="sub">บันทึกการใช้บัตร</span>
  </div>

</div>
</body>
</html>
